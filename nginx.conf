# Production site for the Angular SPA (mounted at
# /etc/nginx/conf.d/default.conf). It serves the compiled bundle and keeps the
# browser on a single origin: /api/** is reverse-proxied to the Express API, so
# the httpOnly session cookies and the WebSocket handshakes work without CORS.

# Docker's embedded DNS, so the upstream is resolved per request. That lets
# nginx start before the API is healthy and pick up a restarted container
# instead of pinning a stale IP at boot.
resolver 127.0.0.11 valid=10s ipv6=off;

# `Connection` must be "upgrade" only for WebSocket requests and "close"
# otherwise; nginx can't infer this for a proxied connection.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # Dual-stack: the Alpine image resolves `localhost` to ::1 first, so an
  # IPv4-only listener makes in-container healthchecks/curl fail to connect.
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Session cookies plus small JSON health responses — 2 MB matches the API's
  # express.json limit, 5 MB leaves headroom for signed clinical-log payloads.
  client_max_body_size 5m;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # --- API + WebSocket (chat / visits) --------------------------------------
  # `^~` makes this prefix beat the asset regex below, so an /api path is
  # never mistaken for a static file. No trailing URI on proxy_pass, so the
  # request path (/api/ws/chat, /api/me/medications, …) is forwarded verbatim.
  location ^~ /api/ {
    set $api_upstream http://server:3000;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-lived WebSocket connections must not be cut by a read timeout, and
    # responses should stream rather than buffer.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # --- Never cache the shell or the service worker ---------------------------
  # Exact-match locations win over the asset regex, so ngsw-worker.js is
  # revalidated on every load and an app update can be picked up.
  location = /index.html {
    add_header Cache-Control 'no-cache';
  }
  location = /ngsw-worker.js {
    add_header Cache-Control 'no-cache';
  }
  location = /ngsw.json {
    add_header Cache-Control 'no-cache';
  }
  location = /manifest.webmanifest {
    add_header Cache-Control 'no-cache';
  }

  # --- Hashed static assets -------------------------------------------------
  # Angular's production build fingerprints every JS/CSS/binary file
  # (outputHashing: all), so these are safe to cache indefinitely.
  location ~* \.(?:js|css|mjs|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    access_log off;
    try_files $uri =404;
  }

  # --- SPA fallback ---------------------------------------------------------
  # Deep links (/contacts, /history, …) are resolved client-side; anything
  # that isn't a real file falls through to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
